<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>比赛按钮：原图与高清重绘对比</title>
<style>
body{margin:0;padding:24px;background:#151b2a;color:#f1f5fb;font:16px/1.5 system-ui,-apple-system,sans-serif}
h1{margin:0 0 8px}p{color:#b7c5d8;max-width:72ch}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:1300px}
.card{background:#252d40;border:1px solid #3b4860;border-radius:14px;padding:15px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sample{background:repeating-conic-gradient(#e2e5e9 0% 25%,#f5f6f8 0% 50%) 50%/20px 20px;border-radius:8px;min-height:156px;display:flex;align-items:center;justify-content:center}
.sample img{max-width:130px;max-height:130px;object-fit:contain;image-rendering:auto}.sample.original img{max-width:96px;max-height:96px}
.caption{font-size:13px;color:#afc0d8;margin:6px 0 0;text-align:center}a{color:#8bc8ff}.name{font-weight:700;margin:0 0 10px}
</style>
<h1>比赛按钮：原图与高清重绘</h1><p>左侧是 APK 中逐像素提取的原图，右侧是参考原图生成的高清重绘。重绘有细节变化，不代表游戏原生高清资源。点击图片可查看原尺寸。</p>
<div class="grid" id="grid"></div>
<script>
const items=[
['刹车踏板','brake.png','brake_redrawn_hd.png','64×46'],
['红色氮气','n2o.png','n2o_redrawn_hd.png','53×53'],
['蓝色团队氮气','team_n2o.png','team_n2o_redrawn_hd.png','53×53'],
['小喷','small_boost_icon.png','small_boost_icon_redrawn_hd.png','62×64'],
['设置','settings_button.png','settings_button_redrawn_hd.png','43×42'],
['方向示意（设置页）','direction.png','direction_redrawn_hd.png','51×58'],
['漂移示意（设置页）','drift.png','drift_redrawn_hd.png','62×62']
];
document.querySelector('#grid').innerHTML=items.map(([name,original,hd,size])=>`<section class="card"><div class="name">${name}</div><div class="pair"><div><a class="sample original" href="../race_controls/${original}"><img src="../race_controls/${original}" alt="${name}原图"></a><div class="caption">APK 原图 · ${size}</div></div><div><a class="sample" href="${hd}"><img src="${hd}" alt="${name}高清重绘"></a><div class="caption">高清重绘 · 透明 PNG</div></div></div></section>`).join('');
</script></html>
