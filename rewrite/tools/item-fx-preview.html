<!doctype html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道具赛表现层预览</title>
  <style>
    body { margin: 0; background: #1d2633; color: #e8edf3; font: 14px sans-serif; }

  <div id="bar"><div id="controls"></div><span id="status">…</span></div>
