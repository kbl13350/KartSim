<!doctype html><meta charset="utf-8"><title>Track visual comparison evidence</title>
<style>html,body{margin:0;background:#24313d}canvas{display:block;width:960px;height:540px}</style>
<script type="module">
import {WebGLRenderer,Scene,PerspectiveCamera,SRGBColorSpace} from 'three';
import {Sw,Tr} from '/src/generated/library.js';
import {ha,e4,yo,jm} from '/src/generated/formats.js';
import {ul} from '/src/generated/vehicle.js';
import {_L,kv} from '/src/generated/world.js';
import {installWorldOverrides} from '/src/world/install.ts';
import {loadLegacyResourceBundle} from '/src/resources/legacy-adapter.ts';

// This diagnostic page does not change the game's catalogs or resource files.
// Every render uses the same native ad configuration, random seed and clock;
// no textures, fog, materials, or thematic scenery are removed/recolored.
const WIDTH=960,HEIGHT=540,TICK=10000;
installWorldOverrides(_L);
const bundle=await loadLegacyResourceBundle('p3553');
const library=await Sw.load(bundle.sources,undefined,bundle.archiveIndexes);
const catalog=await library.timeAttackTrackCatalog();
const source={importer:new Tr(),toonStageBinding:new ha(),getLibrary:()=>library,
 generationValue:()=>1,isGenerationCurrent:()=>true,
 requireAsset:path=>{const file=library.get(path);if(!file)throw Error('Missing '+path);return file;}};
const loader=new ul(source);
const renderer=new WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.outputColorSpace=SRGBColorSpace;renderer.setPixelRatio(1);renderer.setSize(WIDTH,HEIGHT);
document.body.append(renderer.domElement);
let active;
const v=p=>[p.x,p.y,p.z];
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
function routePlan(data){
 const frames=data.sections.flatMap(section=>section.frames);
 if(!frames.length)throw Error('No route frames');
 const bounds={min:[Infinity,Infinity,Infinity],max:[-Infinity,-Infinity,-Infinity]};
 for(const frame of frames)for(let i=0;i<3;i++){const n=v(frame.position)[i];bounds.min[i]=Math.min(bounds.min[i],n);bounds.max[i]=Math.max(bounds.max[i],n);}
 const ordered=[],seen=new Set();let section=data.firstSection;
 while(!seen.has(section)&&data.sections[section]){
  seen.add(section);const current=data.sections[section];ordered.push(...current.frames);
  const next=current.outgoing.map(edge=>edge.section).sort((a,b)=>a-b).find(index=>!seen.has(index));
  if(next===undefined)break;section=next;
 }
 if(ordered.length<2)ordered.push(...frames);
 const lengths=[0];for(let i=1;i<ordered.length;i++)lengths.push(lengths[i-1]+distance(ordered[i-1].position,ordered[i].position));
 const total=lengths.at(-1),at=fraction=>{
  const target=total*fraction;let index=lengths.findIndex(length=>length>=target);if(index<0)index=ordered.length-1;
  return ordered[index];
 };
 const mid=bounds.min.map((n,i)=>(n+bounds.max[i])/2),dx=bounds.max[0]-bounds.min[0],dz=bounds.max[2]-bounds.min[2];
 const fov=35,tangent=Math.tan(fov*Math.PI/360);
 const altitude=Math.max(dx/(2*tangent*WIDTH/HEIGHT),dz/(2*tangent),50)*1.16;
 const views=[{key:'overview',label:'统一鸟瞰',fov,position:[mid[0],bounds.max[1]+altitude,mid[2]],target:[mid[0],mid[1],mid[2]],up:[0,0,-1]}];
 for(const [key,label,fraction] of [['start','路线起点',0],['third','路线 1/3',1/3],['two-thirds','路线 2/3',2/3],['tail','路线尾端',.95]]){
  const frame=at(fraction),p=frame.position,forward=frame.forward;
  const length=Math.hypot(forward.x,forward.z)||1,fx=forward.x/length,fz=forward.z/length;
  views.push({key,label,fov:65,position:[p.x-fx*12,p.y+7,p.z-fz*12],target:[p.x+fx*23,p.y+2,p.z+fz*23],up:[0,1,0],routeFraction:fraction,routePoint:v(p)});
 }
 return {version:1,width:WIDTH,height:HEIGHT,tick:TICK,bounds,routeLength:total,primarySections:[...seen],allSections:data.sections.length,views};
}
window.disposeTrack=()=>{
 if(!active)return;
 active.world?.dispose();
 if(!active.world){active.map?.renderScene?.dispose();active.map?.skydome?.dispose();}
 active.map?.environment?.dispose();active=undefined;renderer.renderLists.dispose();
};
window.loadComparisonTrack=async(candidate,sharedPlan)=>{
 window.disposeTrack();const choice=catalog.find(row=>row.id===candidate.id);
 if(!choice&&!candidate.path)throw Error('Track absent from catalog: '+candidate.id);
 const path=candidate.path??choice.path;
 const map=await loader.loadAssetMap(path,candidate.id);
 active={map};const world=new _L(map.data,map.scene,map.renderScene,map.skydome);active.world=world;
 const scene=new Scene();scene.add(world.group);kv(scene,world);active.scene=scene;
 const ownPlan=routePlan(map.data),plan=sharedPlan??ownPlan;
 if(plan.width!==WIDTH||plan.height!==HEIGHT)throw Error('Camera plan dimensions differ');
 active.plan=plan;
 return {id:candidate.id,title:candidate.title??choice?.title,path:map.path,requestedPath:path,
  textureTheme:map.metadata.textureTheme??map.metadata.theme,sections:map.data.sections.length,
  ownRouteBounds:ownPlan.bounds,ownRouteLength:ownPlan.routeLength,plan,
  captureVersion:2,nativeFog:world.fog,nativeCameraFar:world.cameraFar,nativeSkydome:!!world.skydome,
  nativeWeather:map.data.weather,environmentPolicy:'Original skydome separate pass, native fog and color pipeline. Overview only extends camera/fog range to fit whole route; road views use native fog/far.',
  deterministic:{tick:TICK,wallClock:Date.now(),advertisements:'native static ingame config; no imagery masked',textures:'unchanged',materials:'unchanged',randomSeed:'0x4b415254'}};
};
window.renderComparisonView=async(key)=>{
 if(!active)throw Error('No active track');
 const {map,world,scene,plan}=active,view=plan.views.find(view=>view.key===key);if(!view)throw Error('Unknown view '+key);
 const extent=Math.hypot(...plan.bounds.max.map((n,i)=>n-plan.bounds.min[i]));
 const overview=view.key==='overview',far=overview?Math.max(world.cameraFar??300,extent*8,10000):(world.cameraFar??300);
 const camera=new PerspectiveCamera(view.fov,WIDTH/HEIGHT,.1,far);
 kv(scene,overview?{fog:world.fog,cameraFar:far}:world);
 camera.position.set(...view.position);camera.up.set(...view.up);camera.lookAt(...view.target);camera.updateMatrixWorld(true);
 map.stageBinding?.beginFrame?.(TICK);world.resetRender(TICK,camera,WIDTH,HEIGHT);world.updateRender(TICK,camera,WIDTH,HEIGHT);
 // Follow the real stage-render passes, including native sort keys/color pipeline.
 renderer.info.autoReset=false;renderer.info.reset();renderer.autoClear=false;
 renderer.clear(true,true,true);renderer.setTransparentSort(jm);
 if(world.skydome){e4(world.skydome,camera);yo(renderer,()=>renderer.render(world.skydome,camera));}
 e4(scene,camera,false);yo(renderer,()=>renderer.render(scene,camera));
 renderer.setTransparentSort(null);renderer.autoClear=true;
 await new Promise(resolve=>requestAnimationFrame(resolve));
 const gl=renderer.getContext(),pixels=new Uint8Array(WIDTH*HEIGHT*4);gl.readPixels(0,0,WIDTH,HEIGHT,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 let varied=0;const first=[...pixels.slice(0,3)];for(let i=0;i<pixels.length;i+=4)if(pixels[i]!==first[0]||pixels[i+1]!==first[1]||pixels[i+2]!==first[2])varied++;
 return {key,camera:view,environment:{skyRendered:!!world.skydome,fog:scene.fog?.toJSON?.()??null,cameraFar:far,overviewFogRangeExtended:overview},triangles:renderer.info.render.triangles,drawCalls:renderer.info.render.calls,variedPixels:varied,nonuniform:varied>WIDTH*HEIGHT*.001};
};
window.closeComparison=()=>{window.disposeTrack();renderer.dispose();renderer.forceContextLoss();};
window.ready=true;
</script>
